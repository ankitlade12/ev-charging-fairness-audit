[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evfair-research"
version = "0.1.0"
description = "Leakage-safe EV charging research replay and audit"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.4", "pandas==2.3.3", "scipy==1.16.3", "scikit-learn==1.8.0", "matplotlib==3.10.8"]

[project.scripts]
evfair = "evfair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
